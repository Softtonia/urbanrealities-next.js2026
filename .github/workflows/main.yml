name: Deploy Next.js to Holiplaces

on:
  push:
    branches:
      - dev

concurrency:
  group: holiplaces-deploy
  cancel-in-progress: true

jobs:
  deploy:
    name: Build and Deploy to Server
    runs-on: ubuntu-latest
    timeout-minutes: 45

    env:
      SERVER_PATH: /var/www/holiplaces.com
      APP_NAME: holiplaces
      SSH_PORT: 22
      PORT: 3000

    steps:
      - name: Checkout Code
        uses: actions/checkout@v5

      - name: Setup Node.js
        uses: actions/setup-node@v5
        with:
          node-version: 22
          cache: npm

      - name: Prepare Public Folders
        run: |
          if [ -d "img" ]; then
            mkdir -p public/img
            rsync -a img/ public/img/
          fi

          if [ -d "data" ]; then
            mkdir -p public/data
            rsync -a data/ public/data/
          fi

      - name: Install Dependencies on GitHub Runner
        run: |
          if [ -f package-lock.json ]; then
            npm ci --legacy-peer-deps --no-audit --no-fund
          else
            npm install --legacy-peer-deps --no-audit --no-fund
          fi

      - name: Build Next.js on GitHub Runner
        run: |
          export NEXT_TELEMETRY_DISABLED=1
          export NODE_OPTIONS="--max-old-space-size=4096"

          npm run build

          if [ ! -d ".next" ]; then
            echo "ERROR: .next build folder missing"
            exit 1
          fi

      - name: Setup SSH
        run: |
          mkdir -p ~/.ssh
          echo "${{ secrets.SERVER_SSH_KEY }}" > ~/.ssh/id_rsa
          chmod 600 ~/.ssh/id_rsa
          ssh-keyscan -p ${{ env.SSH_PORT }} -H ${{ secrets.SERVER_HOST }} >> ~/.ssh/known_hosts

      - name: Upload Built Release to Server
        run: |
          RELEASE_DIR="${{ env.SERVER_PATH }}/releases/${{ github.sha }}"

          ssh -i ~/.ssh/id_rsa -p ${{ env.SSH_PORT }} ${{ secrets.SERVER_USER }}@${{ secrets.SERVER_HOST }} \
            "mkdir -p '${{ env.SERVER_PATH }}/releases' && rm -rf '$RELEASE_DIR' && mkdir -p '$RELEASE_DIR'"

          rsync -az --delete \
            -e "ssh -i ~/.ssh/id_rsa -p ${{ env.SSH_PORT }}" \
            --exclude ".git" \
            --exclude ".github" \
            --exclude "node_modules" \
            --exclude ".next/cache" \
            --exclude ".env" \
            --exclude ".env.local" \
            --exclude ".env.production" \
            --exclude "*.zip" \
            --exclude "*.tar" \
            --exclude "*.tar.gz" \
            ./ \
            ${{ secrets.SERVER_USER }}@${{ secrets.SERVER_HOST }}:$RELEASE_DIR/

      - name: Activate Release on Server
        run: |
          ssh -i ~/.ssh/id_rsa -p ${{ env.SSH_PORT }} ${{ secrets.SERVER_USER }}@${{ secrets.SERVER_HOST }} bash -s << 'SERVER_SCRIPT'
            set -Eeuo pipefail

            SERVER_PATH="/var/www/holiplaces.com"
            RELEASE_DIR="$SERVER_PATH/releases/${{ github.sha }}"
            APP_NAME="holiplaces"
            PORT="3000"

            PREVIOUS_RELEASE=""

            if [ -L "$SERVER_PATH/current" ] || [ -d "$SERVER_PATH/current" ]; then
              PREVIOUS_RELEASE="$(readlink -f "$SERVER_PATH/current" || true)"
            fi

            show_logs() {
              echo "================ PM2 STATUS ================"
              pm2 status || true

              echo "================ PM2 LOGS ================"
              pm2 logs "$APP_NAME" --lines 120 --nostream || true

              echo "================ PORT 3000 STATUS ================"
              ss -ltnp | grep ":$PORT" || true
            }

            is_port_open() {
              ss -ltn 2>/dev/null | awk '{print $4}' | grep -q ":$PORT$"
            }

            wait_for_app() {
              echo "Waiting for Next.js server on port $PORT..."

              for i in {1..30}; do
                if is_port_open; then
                  echo "Next.js is listening on port $PORT"
                  ss -ltnp | grep ":$PORT" || true
                  return 0
                fi

                if ! pm2 describe "$APP_NAME" >/dev/null 2>&1; then
                  echo "PM2 app does not exist while waiting."
                  show_logs
                  return 1
                fi

                if ! pm2 describe "$APP_NAME" | grep -q "online"; then
                  echo "PM2 app is not online."
                  show_logs
                  return 1
                fi

                echo "Waiting for port $PORT... attempt $i"
                sleep 2
              done

              echo "ERROR: Next.js did not open port $PORT."
              show_logs
              return 1
            }

            start_app() {
              TARGET_DIR="$1"

              echo "Installing production dependencies on server..."
              cd "$TARGET_DIR"

              if [ -f package-lock.json ]; then
                npm ci --omit=dev --legacy-peer-deps --no-audit --no-fund
              else
                npm install --omit=dev --legacy-peer-deps --no-audit --no-fund
              fi

              echo "Stopping old PM2 process..."
              pm2 delete "$APP_NAME" || true

              echo "Freeing port $PORT if occupied..."
              if command -v fuser >/dev/null 2>&1; then
                fuser -k "$PORT/tcp" || true
              fi

              sleep 2

              echo "Starting PM2..."

              export NODE_ENV=production
              export PORT="$PORT"
              export HOSTNAME="127.0.0.1"

              if [ -f "$TARGET_DIR/ecosystem.config.js" ]; then
                pm2 start "$TARGET_DIR/ecosystem.config.js" --update-env
              else
                pm2 start npm \
                  --name "$APP_NAME" \
                  --cwd "$TARGET_DIR" \
                  -- start
              fi

              pm2 save
            }

            rollback_previous_release() {
              if [ -n "$PREVIOUS_RELEASE" ] && [ -d "$PREVIOUS_RELEASE" ]; then
                echo "Rolling back to previous release..."

                ln -sfnT "$PREVIOUS_RELEASE" "$SERVER_PATH/current"

                if start_app "$SERVER_PATH/current" && wait_for_app; then
                  echo "Rollback completed. Previous release is live."
                  sudo nginx -t && sudo systemctl reload nginx || true
                else
                  echo "Rollback failed."
                  show_logs
                fi
              else
                echo "No previous release available for rollback."
                show_logs
              fi

              exit 1
            }

            echo "Going to release directory..."
            cd "$RELEASE_DIR"

            echo "Removing wrong parent lockfiles..."
            rm -f "$SERVER_PATH/package-lock.json" "$SERVER_PATH/yarn.lock" "$SERVER_PATH/pnpm-lock.yaml"

            echo "Checking required files..."

            if [ ! -d ".next" ]; then
              echo "ERROR: .next folder missing. Build was not uploaded."
              exit 1
            fi

            if [ ! -f "package.json" ]; then
              echo "ERROR: package.json missing."
              exit 1
            fi

            if grep -R "output:[[:space:]]*['\"]standalone['\"]" next.config.* 2>/dev/null; then
              echo "ERROR: output standalone found. Remove output: standalone from next.config."
              exit 1
            fi

            echo "Activating release..."
            ln -sfnT "$RELEASE_DIR" "$SERVER_PATH/current"

            echo "Starting new release..."

            if ! start_app "$SERVER_PATH/current"; then
              echo "ERROR: PM2 start failed."
              rollback_previous_release
            fi

            if ! wait_for_app; then
              echo "ERROR: New release did not start correctly."
              rollback_previous_release
            fi

            echo "Testing Nginx config..."

            if ! sudo nginx -t; then
              echo "ERROR: Nginx config failed."
              rollback_previous_release
            fi

            echo "Reloading Nginx..."
            sudo systemctl reload nginx

            echo "Cleaning old releases..."
            cd "$SERVER_PATH/releases"
            ls -dt */ | tail -n +6 | xargs -r rm -rf

            echo "Deployment completed successfully."
          SERVER_SCRIPT
