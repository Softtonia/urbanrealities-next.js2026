name: Deploy Next.js to Holiplaces

on:
  push:
    branches:
      - dev

concurrency:
  group: holiplaces-deploy
  cancel-in-progress: true

jobs:
  deploy:
    name: Deploy to Server
    runs-on: ubuntu-latest
    timeout-minutes: 30

    env:
      SERVER_PATH: /var/www/holiplaces.com
      APP_NAME: holiplaces
      SSH_PORT: 22
      PORT: 3000
      HOSTNAME: 127.0.0.1

    steps:
      - name: Checkout Code
        uses: actions/checkout@v5

      - name: Setup SSH
        uses: webfactory/ssh-agent@v0.9.1
        with:
          ssh-private-key: ${{ secrets.SERVER_SSH_KEY }}

      - name: Add Server to Known Hosts
        run: |
          mkdir -p ~/.ssh
          ssh-keyscan -p ${{ env.SSH_PORT }} -H ${{ secrets.SERVER_HOST }} >> ~/.ssh/known_hosts

      - name: Upload Code
        run: |
          RELEASE_DIR="${{ env.SERVER_PATH }}/releases/${{ github.sha }}"

          ssh -p ${{ env.SSH_PORT }} ${{ secrets.SERVER_USER }}@${{ secrets.SERVER_HOST }} \
            "mkdir -p '${{ env.SERVER_PATH }}/releases' && rm -rf '$RELEASE_DIR' && mkdir -p '$RELEASE_DIR'"

          rsync -az --delete \
            -e "ssh -p ${{ env.SSH_PORT }}" \
            --exclude ".git" \
            --exclude ".github" \
            --exclude "node_modules" \
            --exclude ".next" \
            --exclude ".env" \
            --exclude ".env.local" \
            --exclude ".env.production" \
            --exclude "*.zip" \
            --exclude "*.tar" \
            --exclude "*.tar.gz" \
            ./ \
            ${{ secrets.SERVER_USER }}@${{ secrets.SERVER_HOST }}:$RELEASE_DIR/

      - name: Build and Activate
        run: |
          ssh -p ${{ env.SSH_PORT }} ${{ secrets.SERVER_USER }}@${{ secrets.SERVER_HOST }} bash -s << 'SERVER_SCRIPT'
            set -e

            SERVER_PATH="/var/www/holiplaces.com"
            RELEASE_DIR="$SERVER_PATH/releases/${{ github.sha }}"
            APP_NAME="holiplaces"
            PORT="3000"
            HOSTNAME="127.0.0.1"

            cd "$RELEASE_DIR"

            echo "Preparing public folders..."

            if [ -d "img" ]; then
              mkdir -p public/img
              rsync -a img/ public/img/
            fi

            if [ -d "data" ]; then
              mkdir -p public/data
              rsync -a data/ public/data/
            fi

            echo "Installing dependencies..."

            if [ -f package-lock.json ]; then
              npm ci --legacy-peer-deps
            else
              npm install --legacy-peer-deps
            fi

            echo "Building Next.js..."

            npm run build

            if [ ! -d ".next" ]; then
              echo "ERROR: .next build folder missing"
              exit 1
            fi

            if [ ! -f ".next/standalone/server.js" ]; then
              echo "ERROR: .next/standalone/server.js missing"
              echo "Make sure next.config.js has: output: 'standalone'"
              exit 1
            fi

            echo "Copying public and static assets for standalone..."

            rm -rf .next/standalone/public
            rm -rf .next/standalone/.next/static

            if [ -d "public" ]; then
              cp -R public .next/standalone/public
            fi

            mkdir -p .next/standalone/.next
            cp -R .next/static .next/standalone/.next/static

            echo "Activating release..."

            ln -sfnT "$RELEASE_DIR" "$SERVER_PATH/current"

            echo "Restarting PM2 with standalone server..."

            pm2 delete "$APP_NAME" || true

            cd "$SERVER_PATH/current"

            PORT="$PORT" HOSTNAME="$HOSTNAME" pm2 start "$SERVER_PATH/current/.next/standalone/server.js" \
              --name "$APP_NAME" \
              --cwd "$SERVER_PATH/current" \
              --update-env

            pm2 save

            echo "Testing local Next.js server..."

            sleep 3
            curl -I "http://127.0.0.1:$PORT" || exit 1

            echo "Reloading nginx..."

            sudo nginx -t
            sudo systemctl reload nginx

            echo "Cleaning old releases..."

            cd "$SERVER_PATH/releases"
            ls -dt */ | tail -n +4 | xargs -r rm -rf

            echo "Deployment completed successfully"
          SERVER_SCRIPT
