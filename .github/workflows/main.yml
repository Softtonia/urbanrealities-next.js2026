name: Deploy Next.js to Holiplaces

on:
  push:
    branches:
      - dev

concurrency:
  group: holiplaces-deploy
  cancel-in-progress: true

jobs:
  deploy:
    name: Deploy to Server
    runs-on: ubuntu-latest
    timeout-minutes: 30

    env:
      SERVER_PATH: /var/www/holiplaces.com
      APP_NAME: holiplaces
      SSH_PORT: 22

    steps:
      - name: Checkout Code
        uses: actions/checkout@v5

      - name: Setup SSH
        uses: webfactory/ssh-agent@v0.9.1
        with:
          ssh-private-key: ${{ secrets.SERVER_SSH_KEY }}

      - name: Add Server to Known Hosts
        run: |
          mkdir -p ~/.ssh
          ssh-keyscan -p ${{ env.SSH_PORT }} -H ${{ secrets.SERVER_HOST }} >> ~/.ssh/known_hosts

      - name: Upload Code
        run: |
          RELEASE_DIR="${{ env.SERVER_PATH }}/releases/${{ github.sha }}"

          ssh -p ${{ env.SSH_PORT }} ${{ secrets.SERVER_USER }}@${{ secrets.SERVER_HOST }} \
            "rm -rf '$RELEASE_DIR' && mkdir -p '$RELEASE_DIR'"

          rsync -az --delete \
            -e "ssh -p ${{ env.SSH_PORT }}" \
            --exclude ".git" \
            --exclude ".github" \
            --exclude "node_modules" \
            --exclude ".next" \
            --exclude ".env" \
            --exclude ".env.local" \
            --exclude "*.zip" \
            --exclude "*.tar" \
            --exclude "*.tar.gz" \
            ./ \
            ${{ secrets.SERVER_USER }}@${{ secrets.SERVER_HOST }}:$RELEASE_DIR/

      - name: Build and Activate
        run: |
          ssh -p ${{ env.SSH_PORT }} ${{ secrets.SERVER_USER }}@${{ secrets.SERVER_HOST }} bash -s << 'SERVER_SCRIPT'
            set -e

            SERVER_PATH="/var/www/holiplaces.com"
            RELEASE_DIR="$SERVER_PATH/releases/${{ github.sha }}"
            APP_NAME="holiplaces"

            cd "$RELEASE_DIR"

            if [ -d "img" ]; then
              mkdir -p public/img
              rsync -a img/ public/img/
            fi

            if [ -d "data" ]; then
              mkdir -p public/data
              rsync -a data/ public/data/
            fi

            if [ -f package-lock.json ]; then
              npm ci --legacy-peer-deps --prefer-offline
            else
              npm install --legacy-peer-deps --prefer-offline
            fi

            npm run build

            if [ ! -d ".next" ]; then
              echo "ERROR: .next build folder missing"
              exit 1
            fi

            ln -sfnT "$RELEASE_DIR" "$SERVER_PATH/current"

            pm2 restart "$APP_NAME" --update-env || pm2 start npm --name "$APP_NAME" -- start
            pm2 save

            cd "$SERVER_PATH/releases"
            ls -dt */ | tail -n +3 | xargs -r rm -rf

            echo "Deployment completed successfully"
          SERVER_SCRIPT
